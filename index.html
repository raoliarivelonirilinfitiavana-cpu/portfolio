        :root {
            --bg-color: #0c1524;
            --card-bg: #111e35;
            --card-border: rgba(212, 175, 55, 0.25);
            --accent-gold: #d4af37;
            --accent-gradient: linear-gradient(135deg, #d4af37 0%, #f3e5ab 100%);
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Défilement fluide et instantané */
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* Effet de lueur d'ambiance en arrière-plan */
        .ambient-glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(12, 21, 36, 0) 70%);
            z-index: 1;
            pointer-events: none;
        }
        
        /* En-tête moderne */
        header {
            padding: 70px 20px 40px 20px;
            background: radial-gradient(circle at center, #162642 0%, #0c1524 100%);
            border-bottom: 1px solid var(--card-border);
            position: relative;
            z-index: 10;
        }
        
        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--accent-gold);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        h1 {
            font-size: 2.2rem;
            color: #ffffff;

            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .role-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-weight: 400;
        }
        
        .portfolio-bio {
            font-size: 0.85rem;

            gap: 10px;
            max-width: 850px;
            margin: 0 auto;
        }
        
        .skill-badge {
            background: var(--card-bg);
            color: var(--accent-gold);
            font-size: 0.75rem;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            font-weight: 500;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
            text-transform: none;
        }
        
        .skill-badge:hover {
            background: var(--accent-gold);
            color: var(--bg-color);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.25);
        }
        
        /* Conteneur et image principale */
        .container {
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #070b14;
            position: relative;
        }
        
        .portfolio-img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
            margin: 0;
            content-visibility: auto;
        }
