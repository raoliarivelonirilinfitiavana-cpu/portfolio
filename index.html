<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - RAOLIARIVELO Nirilin Fitiavana</title>
    <!-- Importation de la police Poppins depuis Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c1524;
            --card-bg: #111e35;
            --card-border: rgba(212, 175, 55, 0.3);
            --accent-gold: #d4af37;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* En-tête avec navigation et bouton CV */
        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cv-btn {
            background: var(--accent-gold);
            color: var(--bg-color);
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .cv-btn:hover {
            background: #ffffff;
            color: var(--bg-color);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
            transform: translateY(-2px);
        }

        /* Conteneur de l'image du portfolio */
        .portfolio-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            text-align: center;
        }

        .portfolio-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <!-- En-tête du portfolio -->
    <header>
        <div class="logo">Nirin Design</div>
        <!-- Bouton pour accéder directement au CV -->
        <a href="cv.html" class="cv-btn">CV</a>
    </header>

    <!-- Section principale avec votre image de portfolio -->
    <div class="portfolio-container">
        <!-- Assurez-vous que votre image s'appelle bien portfolio.jpg dans le même dossier -->
        <img src="portfolio.jpg" alt="Portfolio Raoliarivelo Nirilin Fitiavana">
    </div>

</body>
</html>
