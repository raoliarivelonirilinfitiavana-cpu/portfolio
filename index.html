<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirilin - Portfolio Graphiste</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0c1524; /* Fond bleu nuit inspiré de votre design */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            line-height: 1.6;
        }
        header {
            padding: 40px 20px;
            background: #111e35;
            border-bottom: 3px solid #d4af37; /* Jaune doré élégant de votre logo */
        }
        h1 {
            font-size: 1.5rem;
            color: #d4af37; /* Titre aux couleurs de votre lettrage */
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p {
            font-size: 0.3rem;
            color: #b0c4de;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .portfolio-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            border: 2px solid #d4af37; /* Un léger contour doré pour faire ressortir votre œuvre */
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin: 20px 0;
        }
        footer {
            background: #111e35;
            padding: 30px 20px;
            margin-top: 40px;
            border-top: 1px solid #1e3a5f;
            font-size: 0.9rem;
            color: #b0c4de;
        }
    </style>
</head>
<body>

    <header>
        <h1>RAOLIARIVELO Nirilin Fitiavana</h1>
        <p>Designer Graphique & Illustrateur - Antananarivo, Madagascar</p>
    </header>

    <div class="container">
        <img src="portfolio.jpg" alt="Portfolio de Nirilin" class="portfolio-img">
    </div>

    <footer>
        <p>Contact : +261 34 61 293 96 | raoliarivelonirilinfitiavana@gmail.com</p>
        <p>&copy; 2026 Nirilin. Tous droits réservés.</p>
    </footer>

</body>
</html>
