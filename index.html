<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirilin - Portfolio Graphiste</title>
    <!-- Importation de la police Poppins depuis Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0c1524; /* Fond bleu nuit inspiré de votre design */
            color: #ffffff;
            font-family: 'Poppins', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            line-height: 1.6;
        }
        header {
            padding: 40px 20px;
            background: #111e35;
            border-bottom: 3px solid #d4af37; /* Jaune doré élégant de votre logo */
        }
        h1 {
            font-size: 1.5rem;
            color: #d4af37; /* Titre aux couleurs de votre lettrage */
            margin-bottom: 10px;
            letter-spacing: 1px;
            font-weight: 700;
        }
        /* Style "Thin" (léger) appliqué uniquement au premier mot RAOLIARIVELO */
        h1 .thin-name {
            font-weight: 300;
        }
        p {
            font-size: 0.7rem;
            color: #b0c4de;
        }
        .container {
            width: 100%;
            margin: 0;
            padding: 0;
        }
        .portfolio-img {
            width: 100%;
            height: auto !important; /* Force l'affichage complet de toute la hauteur de l'image */
            display: block;
            border: none;
            border-radius: 0;
            box-shadow: none;
            margin: 0;
        }
        footer {
            background: #111e35;
            padding: 30px 20px;
            margin-top: 0;
            border-top: 1px solid #1e3a5f;
            font-size: 0.9rem;
            color: #b0c4de;
        }
    </style>
</head>
<body>

    <header>
        <h1><span class="thin-name">RAOLIARIVELO</span> Nirilin Fitiavana</h1>
        <p>Designer Graphique & Illustrateur - Antananarivo, Madagascar</p>
    </header>

    <div class="container">
        <img src="portfolio.jpg" alt="Portfolio de Nirilin" class="portfolio-img">
    </div>

    <footer>
        <p>Contact : +261 34 61 293 96 | raoliarivelonirilinfitiavana@gmail.com</p>
        <p>&copy; 2026 Nirilin. Tous droits réservés.</p>
    </footer>

</body>
</html>
